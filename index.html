}
async function fetchPublicStatus(url){
 const r=await fetch(url,{cache:"no-store"});
 if(!r.ok)throw new Error("HTTP "+r.status);
 const j=await r.json();
 return indicatorState(j&&j.status&&j.status.indicator);
}
async function refreshWeather(){
 if(weatherLoading)return;
 weatherLoading=true;
 try{
   const targets=[
    ["github","https://www.githubstatus.com/api/v2/status.json"],
    ["cloudflare","https://www.cloudflarestatus.com/api/v2/status.json"],
    ["openai","https://status.openai.com/api/v2/status.json"]
   ];
   const res=await Promise.allSettled(targets.map(x=>fetchPublicStatus(x[1])));
   res.forEach((r,i)=>weatherLive[targets[i][0]]=r.status==="fulfilled"?r.value:"unknown");
   weatherUpdated=Date.now();weatherLoaded=true;
 }finally{
   weatherLoading=false;
   if(state.view==="weather"&&!state.q)render();
 }
}
window.refreshWeather=refreshWeather;

function home(){
 return `<div class=sectionTitle><h2>Centres mobiles</h2></div><div class=homegrid>
 <button class=homecard onclick="setView('communications')"><span class=icon>✉</span><b>Communications</b><p>${allComms().length} templates classés par thème.</p></button>
 <button class=homecard onclick="setView('scripts')"><span class=icon>⌨</span><b>Scripts & commandes</b><p>${DATA.scripts.length} commandes classées comme dans l'outil Windows.</p></button>
 <button class=homecard onclick="setView('favorites')"><span class=icon>★</span><b>Favoris</b><p>Retrouver les éléments utilisés le plus souvent.</p></button>
 <button class=homecard onclick="setView('recent')"><span class=icon>↻</span><b>Récents</b><p>Historique local des dernières copies.</p></button>
 <button class=homecard onclick="setView('weather')"><span class=icon>🌤️</span><b>Météo IT</b><p>Voyants publics, incidents majeurs et dates de release.</p></button>
 </div>`;
}
function searchAll(q){
 const n=norm(q);let out=[];
 allComms().forEach(x=>{if(norm(x.theme+" "+x.title+" "+x.content).includes(n))out.push(["com",x])});
 DATA.scripts.forEach(x=>{if(norm(x.theme+" "+x.title+" "+x.content).includes(n))out.push(["script",x])});
 return out;
}
function special(kind){
 let rows=[];
 if(kind==="favorites"){
   allComms().forEach(x=>{if(fav.has(key("com",x)))rows.push(["com",x])});
   DATA.scripts.forEach(x=>{if(fav.has(key("script",x)))rows.push(["script",x])});
 }else{
   rows=recent.map(r=>[r.type,{theme:r.theme,title:r.title,content:r.content}]);
 }
 return `<div class=sectionTitle><h2>${kind==="favorites"?"Favoris":"Récents"}</h2></div><div class=list>${rows.length?rows.map(([t,x])=>card(t,x)).join(""):`<div class=empty>Aucun élément pour le moment.</div>`}</div>`;
}
function render(){
 let html="";
 const title=document.getElementById("title"),sub=document.getElementById("subtitle");
 if(state.q){
   let rows=searchAll(state.q);title.textContent="Recherche";sub.textContent=`${rows.length} résultat(s) dans les communications et scripts.`;
   html=`<div class=sectionTitle><h2>Résultats</h2></div><div class=list>${rows.length?rows.map(([t,x])=>card(t,x)).join(""):`<div class=empty>Aucun résultat.</div>`}</div>`;
 } else if(state.view==="home"){title.textContent="Accueil";sub.textContent="Communications, templates, commandes et scripts pour le support IT.";html=home()}
 else if(state.view==="communications"){title.textContent="Communications";sub.textContent="Choisis d'abord un thème, puis le template à copier ou personnaliser.";html=listView("com")}
 else if(state.view==="scripts"){title.textContent="Scripts & commandes";sub.textContent="Choisis la thématique puis la commande à utiliser sur le poste Windows.";html=listView("script")}
 else if(state.view==="favorites"){title.textContent="Favoris";sub.textContent="Tes éléments enregistrés sur cet appareil.";html=special("favorites")}
 else if(state.view==="recent"){title.textContent="Récents";sub.textContent="Derniers éléments copiés sur cet appareil.";html=special("recent")}
 else if(state.view==="weather"){title.textContent="Météo IT";sub.textContent="🌤️ Statuts publics, voyants live et dernières releases pour le support.";html=weatherView()}
 document.getElementById("content").innerHTML=html;
 if(state.view==="weather"&&!state.q&&!weatherLoaded&&!weatherLoading)setTimeout(refreshWeather,0);
 document.getElementById("c1").textContent=allComms().length;
 document.getElementById("c2").textContent=DATA.scripts.length;
 document.getElementById("c3").textContent=DATA.commThemes.length+DATA.scriptThemes.length;
}
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value;render()});
document.querySelectorAll(".navb").forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.getElementById("closeEdit").onclick=()=>document.getElementById("editModal").classList.remove("open");
document.getElementById("closeNew").onclick=()=>document.getElementById("newModal").classList.remove("open");
document.getElementById("createTpl").onclick=()=>{
 let title=document.getElementById("newTitle").value.trim(),body=document.getElementById("newBody").value.trim(),theme=document.getElementById("newTheme").value;
 if(!title||!body)return;
 custom.push({theme,title,content:body,source:"personnalisé"});save();
 document.getElementById("newTitle").value="";document.getElementById("newBody").value="";
 document.getElementById("newModal").classList.remove("open");state.view="communications";state.theme=theme;render();
};
document.getElementById("editModal").addEventListener("click",e=>{if(e.target.id==="editModal")e.currentTarget.classList.remove("open")});
document.getElementById("newModal").addEventListener("click",e=>{if(e.target.id==="newModal")e.currentTarget.classList.remove("open")});
render();
</script>
