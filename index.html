<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071a38">
<title>Super Support IT Mobile</title>
<style>
:root{--nav:#071a38;--nav2:#0b3b76;--blue:#1770c7;--red:#e32939;--bg:#f4f7fb;--card:#fff;--txt:#17263f;--muted:#667890;--line:#dfe8f3;--green:#078451}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding-bottom:88px}.top{position:sticky;top:0;z-index:30;background:linear-gradient(125deg,#06152f,#0c3e7c);color:#fff;padding:max(12px,env(safe-area-inset-top)) 14px 12px;box-shadow:0 4px 18px #00152e35}
.brand{display:flex;align-items:center;gap:10px}.dots{display:flex;gap:4px}.dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 9px #ff3046}.name{font-weight:850;font-size:17px}.version{font-size:10px;opacity:.68;margin-left:auto}
.search{width:100%;margin-top:10px;border:0;border-radius:13px;padding:12px 14px;font-size:16px;outline:none;background:#fff;color:#17263f}
main{padding:13px;max-width:900px;margin:auto}.hero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 17px #0b2a560c}.hero h1{margin:0 0 5px;font-size:21px}.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.stats{display:flex;gap:8px;margin-top:13px;overflow:auto}.stat{flex:0 0 auto;background:#f7faff;border:1px solid var(--line);padding:9px 11px;border-radius:12px}.stat b{display:block;color:#0d5da8;font-size:17px}.stat span{font-size:10px;color:var(--muted)}
.sectionTitle{display:flex;align-items:center;gap:8px;margin:16px 2px 10px}.sectionTitle h2{font-size:16px;margin:0}.back{border:0;background:#eaf3fd;color:#0b5ba6;border-radius:10px;padding:8px 10px;font-weight:700}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.homecard{border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px 13px;text-align:left;box-shadow:0 3px 14px #092b550a}.homecard .icon{font-size:29px;display:block;margin-bottom:9px}.homecard b{font-size:15px}.homecard p{font-size:11px;color:var(--muted);margin:5px 0 0;line-height:1.35}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.theme{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;text-align:left;min-height:94px;box-shadow:0 2px 11px #0b2b5909}.theme b{display:block;font-size:13px}.theme span{font-size:11px;color:var(--muted);display:block;margin-top:5px}.count{color:#0d65b3!important;font-weight:800}
.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:0 2px 11px #0a2a5308}.itemhead{display:flex;gap:8px;align-items:flex-start}.item h3{font-size:14px;margin:0;flex:1}.tag{font-size:9px;background:#eaf3fd;color:#0b5ea9;border-radius:999px;padding:4px 7px;font-weight:800}.pre{white-space:pre-wrap;word-break:break-word;font:12px/1.42 Menlo,Consolas,monospace;background:#f6f8fb;border:1px solid var(--line);padding:10px;border-radius:10px;margin:10px 0;max-height:200px;overflow:auto}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:10px;padding:9px 11px;font-weight:700;font-size:12px}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.star{margin-left:auto}.empty{text-align:center;color:var(--muted);padding:30px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -4px 18px #07214818}
.navb{border:0;background:transparent;color:#64758d;font-size:9px;padding:5px 1px}.navb i{font-style:normal;font-size:20px;display:block;margin-bottom:2px}.navb.active{color:#0b65b4;font-weight:800}
.modal{position:fixed;inset:0;z-index:80;background:#071a38cc;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:16px;padding-bottom:max(18px,env(safe-area-inset-bottom))}.sheet h2{font-size:17px;margin:0 0 10px}.editor{width:100%;min-height:48vh;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.45 Menlo,Consolas,monospace;resize:vertical}.form input,.form select,.form textarea{width:100%;margin:5px 0 10px;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px}.form textarea{min-height:180px}

.weatherTop{margin-top:14px;background:linear-gradient(135deg,#071a38,#0b3b76);color:#fff;border-radius:18px;padding:15px;box-shadow:0 8px 24px #06234a22}
.weatherTop h2{margin:0;font-size:17px}.weatherTop p{margin:5px 0 0;font-size:11px;opacity:.82;line-height:1.4}
.weatherCounters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.weatherPill{display:flex;align-items:center;gap:6px;background:#ffffff12;border:1px solid #ffffff22;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:800}
.weathergrid{display:grid;gap:10px}.weathercard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 3px 14px #092b550a}
.weatherhead{display:flex;align-items:center;gap:10px}.weatherIcon{font-size:25px;width:34px;text-align:center}.weatherName{font-size:14px;font-weight:850;flex:1}.weatherState{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--muted)}
.led{width:11px;height:11px;border-radius:50%;display:inline-block;background:#9aa8b8;box-shadow:0 0 0 3px #9aa8b81e,0 0 9px #9aa8b866}.led.ok{background:#16b364;box-shadow:0 0 0 3px #16b3641e,0 0 11px #16b364}.led.warn{background:#f5a524;box-shadow:0 0 0 3px #f5a5241e,0 0 11px #f5a524}.led.down{background:#e32939;box-shadow:0 0 0 3px #e329391e,0 0 11px #e32939}.led.info{background:#1770c7;box-shadow:0 0 0 3px #1770c71e,0 0 9px #1770c7}
.weatherMeta{margin:9px 0 0 44px;font-size:11px;line-height:1.45;color:var(--muted)}.weatherMeta b{color:var(--txt)}.weatherActions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0 44px}.weatherActions a{text-decoration:none}
.releaseBar{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.releaseChip{flex:0 0 auto;background:#eef5fd;border:1px solid #d7e7f8;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:800;color:#0b5ea9}
.weatherUpdated{font-size:10px;color:var(--muted);margin:8px 2px 0}.weatherRefresh{margin-left:auto}
@media(min-width:700px){.weathergrid{grid-template-columns:1fr 1fr}}

@media(min-width:700px){.themes{grid-template-columns:repeat(3,1fr)}.list{grid-template-columns:1fr 1fr}.homegrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="name">Super Support IT</div><div class="version">MOBILE 1.19.0</div></div>

<main>

</div></div>

<script>
const DATA={"version": "Mobile 1.19.0", "communications": [{"category": "Teams", "title": "Teams - Message automatique support", "content": "Bonjour,\n\nMerci pour votre message.\n\n\nCeci est un message automatique.\n\nJe suis actuellement occupé et ne pourrai malheureusement pas traiter votre demande via Teams.\n\n\nPour toute demande de support ou incident, merci d'ouvrir un ticket Ticket :\n\n🔗 https://www.Ticket.com/\n\n📞 En cas d'urgence uniquement, la Hotline est joignable au 01.41.33.85.85, selon les horaires du service informatique sans interruption.\n\n\nMerci de votre compréhension.", "theme": "Tickets", "source": "conservé"}, {"category": "Ticket", "title": "Ticket - DEMANDE - Premier contact", "content": "DEMANDE - Premier contact\n\nBonjour,\n\nNous vous contactons au sujet de votre demande XX.\n\nAfin de pouvoir traiter votre demande, pourriez-vous nous faire part de votre retour et/ou nous communiquer vos prochaines disponibilités, s'il vous plaît ?\n\nMerci d'avance.\n\nCordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Ticket", "title": "Ticket - DEMANDE - Relance", "content": "DEMANDE - Relance\n\nBonjour,\n\nNous avons tenté de vous joindre au sujet de votre demande XX le XX.\n\nSans retour de votre part, nous ne sommes pas en mesure de poursuivre le traitement de votre demande.\n\nPourriez-vous nous faire part de votre retour et/ou nous communiquer vos prochaines disponibilités, s'il vous plaît ?\n\nMerci d'avance.\n\nCordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Ticket", "title": "Ticket - DEMANDE - Dernière relance avant clôture", "content": "DEMANDE - Dernière relance avant clôture\n\nBonjour,\n\nNous avons tenté de vous joindre au sujet de votre demande XX les XX et XX.\n\nSans retour de votre part, nous procéderons à la clôture administrative de votre demande à compter du XX.\n\nAfin d'éviter cette fermeture, pourriez-vous nous faire part de votre retour et/ou nous communiquer vos prochaines disponibilités, s'il vous plaît ?\n\nMerci d'avance.\n\nCordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Ticket", "title": "Ticket - DEMANDE - Clôture administrative", "content": "DEMANDE - Clôture administrative\n\nBonjour,\n\nMalgré nos différentes tentatives de contact concernant votre demande XX, nous n'avons reçu aucun retour de votre part.\n\nNous procédons donc à la clôture administrative de votre demande.\n\nSi votre besoin est toujours d'actualité, nous vous invitons à créer une nouvelle demande via le portail Ticket :\n\nhttps://www.Ticket.com/\n\nPour toute urgence uniquement, notre Hotline est joignable au 01 41 33 85 85, selon les horaires du service informatique.\n\nMerci de votre compréhension.\n\nCordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Ticket", "title": "Ticket - INCIDENT - Premier contact", "content": "INCIDENT - Premier contact\n\nBonjour,\n\nNous vous contactons au sujet de votre incident XX.\n\nAfin de pouvoir poursuivre sa résolution, pourriez-vous nous faire part de votre retour et/ou nous communiquer vos prochaines disponibilités, s'il vous plaît ?\n\nMerci d'avance.\n\nCordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Ticket", "title": "Ticket - INCIDENT - Demande d'informations diagnostic", "content": "Bonjour,\n\nJe vous contacte au sujet du ticket que vous avez ouvert.\n\nAfin de poursuivre l'analyse et résoudre votre incident, pourriez-vous nous transmettre les informations suivantes :\n\n\t• Le message d'erreur exact rencontré ;\n\n\t• Une capture d'écran de l'erreur (si possible) ;\n\n\t• Les étapes qui ont conduit à l'apparition du problème.\n\nCes éléments nous permettront d'identifier plus rapidement l'origine de l'incident et de vous apporter une solution adaptée.\n\nDans l'attente de votre retour.\n\nCordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Ticket", "title": "Ticket - INCIDENT - Relance", "content": "INCIDENT - Relance\n\nBonjour,\n\nNous avons tenté de vous joindre au sujet de votre incident XX le XX.\n\nSans retour de votre part, nous ne sommes pas en mesure de poursuivre sa résolution.\n\nPourriez-vous nous faire part de votre retour et/ou nous communiquer vos prochaines disponibilités, s'il vous plaît ?\n\nMerci d'avance.\n\nCordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Ticket", "title": "Ticket - INCIDENT - Dernière relance avant clôture", "content": "INCIDENT - Dernière relance avant clôture\n\nBonjour,\n\nNous avons tenté de vous joindre au sujet de votre incident XX les XX et XX.\n\nSans retour de votre part, nous procéderons à la clôture administrative de votre ticket à compter du XX.\n\nAfin d'éviter cette fermeture, pourriez-vous nous faire part de votre retour et/ou nous communiquer vos prochaines disponibilités, s'il vous plaît ?\n\nMerci d'avance.\n\nCordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Ticket", "title": "Ticket - INCIDENT - Clôture administrative", "content": "INCIDENT - Clôture administrative\n\nBonjour,\n\nMalgré nos différentes tentatives de contact concernant votre incident XX, nous n'avons reçu aucun retour de votre part.\n\nNous procédons donc à la clôture administrative de votre ticket.\n\nSi le problème persiste, nous vous invitons à créer une nouvelle demande via le portail Ticket :\n\nhttps://www.Ticket.com/\n\nPour toute urgence uniquement, notre Hotline est joignable au 01 41 33 85 85, selon les horaires du service informatique.\n\nMerci de votre compréhension.\n\nCordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Ticket", "title": "Ticket - Mauvais type de ticket REQ / Incident", "content": "REQ = incident cancel\n\nBonjour,\n\nVotre ticket n'est pas une demande mais un incident.\n\nAfin de déclarer un incident auprès de nos équipe de support, nous vous invitons de créer un ticket INCIDENT depuis le site https://www.Ticket.com/ dans la rubrique.\n\nMerci de votre compréhension\n\nCordialement", "theme": "Tickets", "source": "conservé"}, {"category": "Acces / MFA", "title": "MFA - Réinitialisation collaborateur + procédure", "content": "Bonjour,\n\n\nLa réinitialisation de l'authentification multifacteur (MFA) a été effectuée pour le collaborateur.\n\nLors de sa prochaine connexion, il pourra reconfigurer sa double authentification en renseignant une adresse e‑mail et un numéro de téléphone.\n\n\nS'il souhaite utiliser Microsoft Authenticator, il pourra suivre la procédure détaillée ci‑dessous pour finaliser l'association de son compte.\n\n\nN'hésitez pas si vous avez besoin d'informations complémentaires.\n\n\n>>Reconfigurer votre application Microsoft Authenticator afin de sécuriser vos accès via l'authentification multifacteur (MFA).\n\n📱 Étapes à suivre :\n\n1. Téléchargez l'application Microsoft Authenticator\n\n• Disponible sur l'App Store (iOS) ou Google Play (Android)\n\n2. Accédez à la page de configuration MFA depuis\n\n👉 https://aka.ms/mfasetup\n\n3. Ajoutez une méthode d'authentification\n\n• Cliquez sur + Ajouter une méthode\n\n• Sélectionnez Application d'authentification\n\n• Choisissez Microsoft Authenticator\n\n4. Associez votre compte à l'application mobile\n\n• Ouvrez l'application sur votre téléphone\n\n• Ajoutez un compte professionnel ou scolaire\n\n• Scannez le code QR affiché sur votre écran\n\n5. Validez la configuration\n\n• Une notification sera envoyée sur votre téléphone\n\n• Suivez les instructions pour confirmer l'association\n\n\n🔒 Important :\n\nCette configuration est essentielle pour garantir la sécurité de vos accès.\n\nEn cas de difficulté, n'hésitez pas à contacter le support informatique.\n\nMerci pour votre collaboration,", "theme": "Accès & MFA", "source": "conservé"}, {"category": "Acces / MFA", "title": "MFA - Procédure Microsoft Authenticator", "content": "Reconfigurer Microsoft Authenticator pour sécuriser vos accès via l'authentification multifacteur (MFA)\n\n📱 Étapes à suivre :\n\n1. Téléchargez l'application Microsoft Authenticator\n\n\t• Disponible sur l'App Store (iOS) et Google Play (Android).\n\n2. Accédez à la page de configuration MFA 👉 https://aka.ms/mfasetup\n\n3. Ajoutez une méthode d'authentification\n\n\t• Cliquez sur + Ajouter une méthode.\n\n\t• Sélectionnez Application d'authentification.\n\n\t• Choisissez Microsoft Authenticator.\n\n4. Associez votre compte à l'application mobile\n\n\t• Ouvrez l'application sur votre téléphone.\n\n\t• Ajoutez un compte professionnel ou scolaire.\n\n\t• Scannez le code QR affiché à l'écran.\n\n5. Validez la configuration\n\n\t• Une notification sera envoyée sur votre téléphone.\n\n\t• Suivez les instructions affichées pour confirmer l'association.\n\n🔒 Important : Cette configuration est essentielle pour garantir la sécurité de vos accès.\n\nEn cas de difficulté, n'hésitez pas à contacter le support informatique.\n\nMerci de votre collaboration.\n\nCordialement,", "theme": "Accès & MFA", "source": "conservé"}, {"category": "Acces / MFA", "title": "MFA - RESET MFA", "content": "RESET MFA\n\n\nObjet : Reconfiguration de Microsoft Authenticator pour l'authentification multifacteur (MFA)\n\nBonjour,\n\nNous vous informons que vous pouvez désormais reconfigurer votre application Microsoft Authenticator afin de sécuriser vos accès via l'authentification multifacteur (MFA).\n\n📱 Étapes à suivre :\n\n1. Téléchargez l'application Microsoft Authenticator\n\n• Disponible sur l'App Store (iOS) ou Google Play (Android)\n\n2. Accédez à la page de configuration MFA\n\n👉 https://aka.ms/mfasetup\n\n3. Ajoutez une méthode d'authentification\n\n• Cliquez sur + Ajouter une méthode\n\n• Sélectionnez Application d'authentification\n\n• Choisissez Microsoft Authenticator\n\n4. Associez votre compte à l'application mobile\n\n• Ouvrez l'application sur votre téléphone\n\n• Ajoutez un compte professionnel ou scolaire\n\n• Scannez le code QR affiché sur votre écran\n\n5. Validez la configuration\n\n• Une notification sera envoyée sur votre téléphone\n\n• Suivez les instructions pour confirmer l'association\n\n\n🔒 Important :\n\nCette configuration est essentielle pour garantir la sécurité de vos accès.\n\nEn cas de difficulté, n'hésitez pas à contacter le support informatique.\n\nMerci pour votre collaboration,", "theme": "Accès & MFA", "source": "conservé"}, {"category": "Acces / MFA", "title": "[Application / portail] - RESET MOT DE PASSE", "content": "RESET MOT DE PASSE [Application / portail]\n\nBonjour,\n\n🔐 Votre mot de passe a été réinitialisé temporairement :\n\nP@ssword260825*\n\n\n🌐 Rappel de l'adresse de connexion du portail :\n\n\n👤 Identifiant :\n\nprenom.nom@compte professionnel.fr\n\n\n⚠️ Attention !\n\n\nPour que l'agent puisse modifier son mot de passe, il faudra saisir le mot de passe temporaire puis créer un nouveau mot de passe\n\n\n🛠️ Il pourra alors le personnaliser en cliquant sur \"Changer\"\n\n📏 Le nouveau mot de passe devra contenir :\n\n• ✅ 14 caractères minimum\n\n• ❌ Ne doit pas contenir le prénom, le nom, le nom de la société etc…\n\n\nCordialement", "theme": "Accès & MFA", "source": "conservé"}, {"category": "Securite", "title": "Sécurité - PHISHING", "content": "PHISHING\n\n\nObjet : 🚨 Rappel – Comment signaler un mail suspect dans Outlook\n\n\nBonjour à tous 👋\n\nSi vous recevez un mail suspect (phishing / hameçonnage) :\n\n1️⃣ Ne cliquez sur rien et n'ouvrez pas les pièces jointes.\n\n2️⃣ Dans Outlook, cliquez sur 📩 \"Signaler un message\" → \"Phishing\".\n\n3️⃣ Si l'option n'apparaît pas, transférez le mail en pièce jointe à ou👉 securite@compte professionnel.com\n\nMerci pour votre vigilance 💪\n\nChaque signalement aide à protéger tout le monde 🛡️\n\nBonne journée,\n\n\n[Ton prénom]", "theme": "Sécurité", "source": "conservé"}, {"category": "Applications", "title": "Applications - Déploiement [Application] to catalogue applicatif", "content": "deployement\n\n\nBonjour,\n\nL'application [Application] to catalogue applicatif a bien été déployée sur votre ordinateur 💻.\n\nAfin de garantir son bon fonctionnement et la réception des mises à jour, il est recommandé d'être connecté au réseau de l'compte professionnel 🏢 ou d'utiliser le VPN 🔐 si vous êtes en télétravail.\n\n\n👉 Si l'application n'apparaît pas immédiatement, un redémarrage de votre poste peut permettre de finaliser l'installation 🔄.\n\n\nMerci de nous faire un retour que l'installation s'est bien déroulée afin de clôturer votre demande. 😊\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - PC prêt avant expédition / appel", "content": "Bonjour,\n\n\nNous vous informons que votre ordinateur est désormais prêt et disponible.\n\nAvant de procéder à son expédition, nous souhaiterions organiser un premier appel de connexion à distance afin de :\n\n\t• Vérifier ensemble le bon fonctionnement de l'équipement\n\n\t• Finaliser les réglages nécessaires\n\n\t• Répondre à vos éventuelles questions\n\n📅 Merci de nous faire part de vos disponibilités dans les prochains jours afin que nous puissions planifier cet échange.\n\nUne fois l'appel effectué, nous procéderons à l'envoi de votre matériel dans les meilleurs délais.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Acces / MFA", "title": "MFA - Réinitialisation + méthodes d'authentification", "content": "Bonjour,\n\nLa réinitialisation de l'authentification multifacteur (MFA) a été effectuée pour le collaborateur.\n\n👉 Lors de sa prochaine connexion, il pourra reconfigurer sa double authentification en choisissant parmi trois méthodes :\n\n• une application d'authentification (Microsoft Authenticator),\n\n• une adresse e‑mail,\n\n• ou un numéro de téléphone (SMS ou appel).\n\nIl est recommandé d'ajouter plusieurs méthodes afin de sécuriser davantage l'accès et éviter tout blocage en cas de perte du téléphone ou d'indisponibilité d'un moyen d'authentification.\n\nS'il souhaite utiliser Microsoft Authenticator, il pourra suivre la procédure détaillée ci‑dessous pour finaliser l'association de son compte avec un appareil.\n\nN'hésitez pas si vous avez besoin d'informations complémentaires.\n\n\n📱 Reconfigurer votre application Microsoft Authenticator (MFA)\n\n1. Téléchargez l'application Microsoft Authenticator\n\n• Disponible sur l'App Store (iOS) ou Google Play (Android)\n\n2. Accédez à la page de configuration MFA\n\n👉 https://aka.ms/mfasetup\n\n3. Ajoutez une méthode d'authentification\n\n• Cliquez sur + Ajouter une méthode\n\n• Sélectionnez Application d'authentification\n\n• Choisissez Microsoft Authenticator\n\n4. Associez votre compte à l'application mobile\n\n• Ouvrez l'application sur votre téléphone\n\n• Ajoutez un compte professionnel ou scolaire\n\n• Scannez le QR code affiché à l'écran\n\n5. Validez la configuration\n\n• Une notification sera envoyée sur votre téléphone\n\n• Suivez les instructions pour confirmer l'association\n\n\n🔒 Important : Cette configuration est essentielle pour garantir la sécurité de vos accès. En cas de difficulté, n'hésitez pas à contacter le support informatique.", "theme": "Accès & MFA", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Retrait service informatique service informatique", "content": "Bonjour,\n\nNous vous informons que votre matériel est désormais disponible et peut être retiré auprès du service informatique, situé au 5ᵉ étage.\n\n🕘 Horaires d'ouverture : selon les horaires du service informatique.\n\nN'hésitez pas à vous présenter durant cette plage horaire pour récupérer votre équipement. Pour toute question ou besoin d'assistance, nous restons à votre disposition.\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Compte environnement professionnel au lieu de compte professionnel", "content": "Bonjour,\n\n\n📌 Je vous contacte au sujet de votre demande de PC pour [Nom du collaborateur].\n\n⚠️ Je constate que le collaborateur dispose d'un compte environnement professionnel au lieu d'un compte compte professionnel.\n\n👉 Merci de contacter les RH afin qu'ils effectuent la modification dans [Application / portail], pour que le collaborateur puisse bénéficier d'un compte compte professionnel et ainsi obtenir un compte Microsoft avec les licences associées.\n\n❌ Sans cette modification dans [Application / portail], le PC ne pourra pas être utilisé.\n\n\nBien à vous,", "theme": "Matériel", "source": "conservé"}, {"category": "Applications", "title": "Applications - [Application] hors périmètre service informatique", "content": "Bonjour,\n\n\nLa service informatique ne prend pas en charge les incidents liés à [Application].\n\nPour toute demande concernant cette application, vous pouvez contacter leur support directement via le site :\n\nhttps://app.[Application].fr/index/, rubrique Aide.\n\n\nMerci de votre compréhension.", "theme": "Applications", "source": "conservé"}, {"category": "Acces / MFA", "title": "Accès - Mot de passe + MFA réinitialisés", "content": "Bonjour,\n\n\nVotre mot de passe a été réinitialisé.\n\n\nVous pouvez définir un nouveau mot de passe en utilisant le lien sécurisé ci‑dessous.\n\nCe lien reste valable pendant une semaine.\n\nhttps://privatebin.net/?5289f7bde3bb0b01#12VsAqV1ATm5k7EC8wRSJ5SQ7QxBTVCzAvZsxhPeCThR\n\n\nUne fois votre nouveau mot de passe créé, merci de vous rendre sur votre espace MyAccount Microsoft afin de le modifier et de le personnaliser.\n\n\nhttps://myaccount.microsoft.com/\n\n\nPar ailleurs, votre authentification multifacteur (MFA) a également été réinitialisée. Vous pourrez la reconfigurer lors de votre prochaine connexion en choisissant la méthode de votre choix : application Microsoft Authenticator, SMS ou adresse e‑mail.\n\n\nN'hésitez pas à revenir vers nous si vous rencontrez la moindre difficulté.\n\n\nCordialement.", "theme": "Accès & MFA", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Compatibilité dock USB-C / adresse agence", "content": "Bonjour,\n\n\nDans le cadre du remplacement de votre ordinateur portable, pouvez-vous m'envoyer une photo de votre station d'accueil (ou de votre écran dock), ou simplement le modèle indiqué dessus ?\n\n\nCela nous permet uniquement de vérifier si votre matériel actuel est compatible USB C.\n\nSi votre équipement devait être remplacé, voici les tarifs informatifs :\n\n\n• 100 € pour une station d'accueil\n\n• 140 € pour un écran standard\n\n• 175 € pour un écran docking\n\n\nVoici un exemple de station d'accueil USB C pour vous aider à identifier votre matériel :\n\n\nPouvez-vous également me confirmer l'adresse de votre agence, afin de prévoir l'envoi du matériel si nécessaire ?\n\n\nMerci d'avance pour votre retour,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - PC prêt et disponible", "content": "Bonjour,\n\n\nVotre ordinateur est désormais préparé et disponible auprès du service informatique.\n\nVous pouvez venir le récupérer pendant les horaires d'ouverture du service informatique.\n\n\nMerci de nous confirmer lorsque le matériel aura bien été récupéré.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - PC prêt pour expédition", "content": "Bonjour,\n\n\nVotre ordinateur est désormais préparé et prêt à être expédié.\n\nMerci de nous confirmer l'adresse de livraison ainsi qu'un numéro de téléphone permettant au transporteur de vous joindre si nécessaire.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Confirmation expédition", "content": "Bonjour,\n\n\nVotre matériel a bien été expédié.\n\nMerci de nous confirmer sa bonne réception afin de nous assurer que tout est conforme.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Casque disponible", "content": "Bonjour,\n\n\nVotre casque est désormais disponible auprès du service informatique.\n\nVous pouvez venir le récupérer pendant les horaires d'ouverture du service informatique.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Chargeur disponible", "content": "Bonjour,\n\n\nVotre chargeur est désormais disponible auprès du service informatique.\n\nVous pouvez venir le récupérer pendant les horaires d'ouverture du service informatique.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Accessoires disponibles", "content": "Bonjour,\n\n\nLe matériel demandé est désormais disponible auprès du service informatique.\n\nVous pouvez venir le récupérer pendant les horaires d'ouverture du service informatique.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Préparation en cours", "content": "Bonjour,\n\n\nVotre matériel est actuellement en cours de préparation par le service informatique.\n\nNous reviendrons vers vous dès qu'il sera disponible ou prêt à être expédié.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Informations expédition", "content": "Bonjour,\n\n\nAfin de préparer l'expédition de votre matériel, merci de nous confirmer votre adresse de livraison complète ainsi qu'un numéro de téléphone permettant au transporteur de vous joindre.\n\n\nMerci d'avance.\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Bonne réception à confirmer", "content": "Bonjour,\n\n\nNous souhaitons vérifier que vous avez bien reçu votre matériel et que celui-ci est fonctionnel.\n\nMerci de nous confirmer la bonne réception afin que nous puissions clôturer la demande.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Retour ancien PC", "content": "Bonjour,\n\n\nDans le cadre du remplacement de votre ordinateur, merci de prévoir la restitution de votre ancien matériel auprès du service informatique ainsi que des accessoires concernés si nécessaire.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Rendez-vous première connexion", "content": "Bonjour,\n\n\nVotre ordinateur est prêt.\n\nNous vous proposons un court rendez-vous avec le service informatique afin d'effectuer la première connexion et de vérifier que vos principaux accès fonctionnent correctement.\n\nMerci de nous communiquer vos disponibilités.\n\n\nBien cordialement,", "theme": "Accès & MFA", "source": "conservé"}, {"category": "Materiel", "title": "Matériel - Mise à disposition complète", "content": "Bonjour,\n\n\nVotre matériel est désormais prêt et disponible : ordinateur, chargeur et accessoires prévus dans votre demande.\n\nVous pouvez venir le récupérer auprès du service informatique pendant les horaires d'ouverture du service informatique.\n\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Applications", "title": "Modern environnement professionnel - Demande installation application", "content": "Bonjour,\n\nVotre demande d'installation d'application a bien été prise en compte par le service informatique.\n\nMerci de nous préciser le nom exact de l'application, sa version si nécessaire, ainsi que le besoin métier associé. Nous vérifierons sa disponibilité et les modalités de déploiement.\n\nBien cordialement,", "theme": "Applications", "source": "conservé"}, {"category": "Applications", "title": "Modern environnement professionnel - Installation application terminée", "content": "Bonjour,\n\nL'installation de l'application demandée a été réalisée.\n\nMerci de vérifier son lancement et son bon fonctionnement. En cas d'anomalie, vous pouvez revenir vers le service informatique avec une capture ou le message d'erreur rencontré.\n\nBien cordialement,", "theme": "Applications", "source": "conservé"}, {"category": "Applications", "title": "Modern environnement professionnel - Demande désinstallation application", "content": "Bonjour,\n\nVotre demande de désinstallation a bien été prise en compte.\n\nMerci de confirmer le nom exact de l'application concernée et, si nécessaire, le poste sur lequel l'opération doit être réalisée.\n\nBien cordialement,", "theme": "Applications", "source": "conservé"}, {"category": "Applications", "title": "Modern environnement professionnel - Désinstallation terminée", "content": "Bonjour,\n\nLa désinstallation de l'application demandée a été réalisée.\n\nMerci de nous signaler si un composant ou un raccourci associé reste présent sur votre poste.\n\nBien cordialement,", "theme": "Applications", "source": "conservé"}, {"category": "Materiel", "title": "Mobile - Téléphone professionnel prêt", "content": "Bonjour,\n\nVotre téléphone professionnel est prêt à être remis.\n\nMerci de nous communiquer vos disponibilités afin d'organiser un rendez-vous avec le service informatique au service informatique.\n\nHoraires du service informatique : selon les horaires du service informatique.\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Mobile - Rendez-vous préparation / remise", "content": "Bonjour,\n\nVotre nouveau mobile est disponible auprès du service informatique au service informatique.\n\nMerci de nous communiquer vos disponibilités afin de planifier la remise et la configuration du téléphone. Prévoir environ 30 minutes.\n\nHoraires du service informatique : selon les horaires du service informatique.\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Materiel", "title": "Mobile - Remise Android terminée", "content": "Bonjour,\n\nVotre téléphone professionnel vous a été remis avec les accessoires prévus.\n\nPour accéder à votre environnement professionnel, vérifiez la connexion à Company Portal et la présence du profil professionnel. Les applications professionnelles sont disponibles dans l'espace de travail.\n\nEn cas de difficulté, contactez le service informatique.\n\nBien cordialement,", "theme": "Matériel", "source": "conservé"}, {"category": "Acces / MFA", "title": "Mobile - iOS problème d'accès Microsoft", "content": "Bonjour,\n\nNous allons vérifier votre accès Microsoft sur iOS.\n\nMerci de vérifier que les applications Microsoft concernées sont à jour. Si nécessaire, le service informatique pourra vous accompagner pour nettoyer l'ancien enregistrement et refaire la connexion au compte professionnel.\n\nBien cordialement,", "theme": "Accès & MFA", "source": "conservé"}, {"category": "Materiel", "title": "Mobile - Intune iOS accompagnement", "content": "Bonjour,\n\nLe service informatique peut vous accompagner pour l'enregistrement de votre iPhone ou iPad dans l'environnement professionnel.\n\nMerci de prévoir votre téléphone, votre mot de passe professionnel et votre méthode MFA. La configuration comprend la connexion, le profil de gestion lorsque celui-ci est requis et la vérification des applications professionnelles.\n\nBien cordialement,", "theme": "Accès & MFA", "source": "conservé"}, {"category": "Materiel", "title": "Mobile - Intune Android accompagnement", "content": "Bonjour,\n\nLe service informatique peut vous accompagner pour la configuration de votre téléphone Android dans Intune.\n\nMerci de prévoir votre téléphone, votre mot de passe professionnel et votre méthode MFA. Nous vérifierons Company Portal, le profil professionnel et l'accès aux applications de travail.\n\nBien cordialement,", "theme": "Accès & MFA", "source": "conservé"}, {"theme": "Tickets", "title": "Ticket - Prise en charge", "content": "Bonjour [Prénom],\n\nVotre ticket [N° ticket] concernant « [Sujet] » a bien été pris en charge.\n\nJe commence l'analyse et je reviendrai vers vous dès que j'aurai un premier résultat ou si des informations complémentaires sont nécessaires.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - Demande d'informations", "content": "Bonjour [Prénom],\n\nAfin de poursuivre l'analyse du ticket [N° ticket], pouvez-vous me transmettre :\n- une capture du message d'erreur ;\n- l'heure approximative du dernier échec ;\n- le nom du poste concerné ;\n- les étapes permettant de reproduire le problème.\n\nMerci d'avance.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - Demande de disponibilité", "content": "Bonjour [Prénom],\n\nPour avancer sur le ticket [N° ticket], j'aurais besoin d'un créneau où vous êtes disponible devant le poste concerné.\n\nPouvez-vous me proposer un créneau qui vous convient ?\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - Intervention à distance", "content": "Bonjour [Prénom],\n\nJe peux poursuivre le diagnostic à distance sur le poste [Nom du poste].\n\nMerci de me confirmer lorsque vous êtes disponible et d'enregistrer votre travail avant l'intervention.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - En attente utilisateur", "content": "Bonjour [Prénom],\n\nLe ticket [N° ticket] est actuellement en attente de votre retour concernant [information attendue].\n\nDès réception, nous pourrons reprendre l'analyse.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - En attente équipe tierce", "content": "Bonjour [Prénom],\n\nVotre ticket [N° ticket] nécessite l'intervention de l'équipe [Équipe / fournisseur].\n\nLe dossier leur a été transmis avec les éléments de diagnostic disponibles. Nous vous tiendrons informé de l'avancement.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - Résolution proposée", "content": "Bonjour [Prénom],\n\nUne correction a été appliquée sur le ticket [N° ticket].\n\nPouvez-vous effectuer un nouveau test et me confirmer si le fonctionnement est revenu à la normale ?\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - Résolution confirmée", "content": "Bonjour [Prénom],\n\nMerci pour votre confirmation.\n\nLe ticket [N° ticket] est résolu et peut être clôturé.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - Clôture sans retour", "content": "Bonjour [Prénom],\n\nSans retour après nos précédentes sollicitations, le ticket [N° ticket] va être clôturé administrativement.\n\nSi le problème est toujours présent, vous pourrez rouvrir une demande en précisant le numéro du ticket initial.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - Mauvaise catégorie", "content": "Bonjour [Prénom],\n\nLa demande a été enregistrée dans une catégorie qui ne correspond pas au besoin identifié.\n\nLe ticket va être réorienté vers la catégorie / équipe adaptée afin de faciliter son traitement.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - Doublon", "content": "Bonjour [Prénom],\n\nLe ticket [N° ticket] fait doublon avec le ticket [N° ticket principal].\n\nPour éviter les traitements parallèles, nous poursuivons le suivi uniquement sur le ticket principal.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Tickets", "title": "Ticket - Hors périmètre", "content": "Bonjour [Prénom],\n\nAprès analyse, cette demande ne relève pas du périmètre du support informatique concerné.\n\nJe vous invite à contacter [Équipe / fournisseur / service] pour la suite du traitement.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Mails", "title": "Mail - Premier contact support", "content": "Bonjour [Prénom],\n\nJe vous contacte concernant votre demande relative à [Sujet].\n\nPouvez-vous me confirmer si le problème est toujours présent et, si oui, me transmettre les éléments disponibles ?\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Mails", "title": "Mail - Confirmation de prise en compte", "content": "Bonjour [Prénom],\n\nVotre demande concernant [Sujet] est bien prise en compte.\n\nNous reviendrons vers vous dès que l'analyse aura progressé.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Mails", "title": "Mail - Proposition de créneau", "content": "Bonjour [Prénom],\n\nJe vous propose une intervention le [Date] à [Heure] pour traiter [Sujet].\n\nMerci de me confirmer si ce créneau vous convient.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Mails", "title": "Mail - Intervention terminée", "content": "Bonjour [Prénom],\n\nL'intervention concernant [Sujet] est terminée.\n\nActions réalisées :\n- [Action 1]\n- [Action 2]\n- [Action 3]\n\nMerci de me confirmer que tout fonctionne correctement de votre côté.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Mails", "title": "Mail - Information utilisateur", "content": "Bonjour [Prénom],\n\nPour information, [Message / changement / consigne].\n\nAucune action n'est requise de votre part sauf si vous constatez une anomalie.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Mails", "title": "Mail - Demande de test utilisateur", "content": "Bonjour [Prénom],\n\nUne action a été réalisée sur [Application / poste / compte].\n\nPouvez-vous effectuer le test suivant : [Test demandé] et me communiquer le résultat ?\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Mails", "title": "Mail - Relance simple", "content": "Bonjour [Prénom],\n\nJe reviens vers vous concernant [Sujet].\n\nAvez-vous eu l'occasion d'effectuer le test demandé / de vérifier si le problème est toujours présent ?\n\nMerci d'avance pour votre retour.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Mails", "title": "Mail - Dernière relance", "content": "Bonjour [Prénom],\n\nDernière relance concernant [Sujet].\n\nSans retour de votre part, nous considérerons que la situation ne nécessite plus d'action immédiate et le dossier pourra être clôturé.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Rapports", "title": "Rapport - Diagnostic synthétique", "content": "RAPPORT DE DIAGNOSTIC\n\nUtilisateur : [Utilisateur]\nPoste : [Nom du poste]\nDate : [Date]\nSujet : [Incident]\n\nConstat :\n[Constat]\n\nTests réalisés :\n- [Test 1] : [Résultat]\n- [Test 2] : [Résultat]\n- [Test 3] : [Résultat]\n\nActions réalisées :\n- [Action 1]\n- [Action 2]\n\nRésultat final :\n[Résultat]\n\nSuite / escalade :\n[Suite]", "source": "nouveau"}, {"theme": "Rapports", "title": "Rapport - Escalade N2/N3", "content": "ESCALADE SUPPORT\n\nTicket : [N° ticket]\nUtilisateur : [Utilisateur]\nPoste : [Poste]\nImpact : [Impact]\nDébut incident : [Date / heure]\n\nSymptôme :\n[Description]\n\nReproduction :\n[Étapes]\n\nDéjà testé :\n- [Test 1]\n- [Test 2]\n- [Test 3]\n\nRésultats / logs :\n[Informations utiles]\n\nBesoin attendu :\n[Expertise / action demandée]", "source": "nouveau"}, {"theme": "Rapports", "title": "Rapport - Incident récurrent", "content": "INCIDENT RÉCURRENT\n\nSujet : [Sujet]\nPérimètre : [Utilisateurs / postes concernés]\nFréquence : [Fréquence]\nPremier cas connu : [Date]\n\nSymptômes communs :\n[Symptômes]\n\nÉléments identiques :\n[Version / application / réseau / matériel]\n\nContournement actuel :\n[Contournement]\n\nAnalyse demandée :\n[Besoin]", "source": "nouveau"}, {"theme": "Rapports", "title": "Rapport - Intervention poste", "content": "COMPTE RENDU D'INTERVENTION\n\nPoste : [Nom]\nUtilisateur : [Nom]\nMotif : [Motif]\n\nAvant intervention :\n[État]\n\nActions :\n- [Action]\n- [Action]\n- [Action]\n\nAprès intervention :\n[État]\n\nTests de validation :\n[Tests]\n\nStatut : [Résolu / À surveiller / Escaladé]", "source": "nouveau"}, {"theme": "Rapports", "title": "Rapport - Matériel", "content": "RAPPORT MATÉRIEL\n\nUtilisateur : [Nom]\nType : [PC / écran / dock / casque / mobile]\nMarque / modèle : [Référence]\nN° série : [Numéro]\nÉtat constaté : [État]\n\nTests :\n[Tests]\n\nConclusion :\n[Réparation / remplacement / retour fournisseur / aucun défaut]", "source": "nouveau"}, {"theme": "Rapports", "title": "Rapport - Réseau", "content": "RAPPORT RÉSEAU\n\nPoste : [Nom]\nInterface : [Ethernet / Wi-Fi]\nIPv4 : [IP]\nPasserelle : [Passerelle]\nDNS : [DNS]\nVPN : [État]\n\nTests :\n- Ping passerelle : [Résultat]\n- DNS : [Résultat]\n- HTTPS : [Résultat]\n- VPN : [Résultat]\n\nConclusion :\n[Conclusion]", "source": "nouveau"}, {"theme": "Rapports", "title": "Rapport - M365", "content": "RAPPORT MICROSOFT 365\n\nUtilisateur : [Compte]\nApplication : [Outlook / Teams / OneDrive / Office]\nVersion : [Version]\n\nSymptôme :\n[Symptôme]\n\nTests :\n- Web : [Résultat]\n- Client local : [Résultat]\n- Autre poste / profil : [Résultat]\n\nActions :\n[Actions]\n\nConclusion :\n[Conclusion]", "source": "nouveau"}, {"theme": "Rapports", "title": "Rapport - Sécurité", "content": "RAPPORT SÉCURITÉ\n\nTicket : [N°]\nUtilisateur / poste : [Informations]\nType : [Phishing / malware / compte / accès / autre]\n\nConstat :\n[Constat]\n\nActions immédiates :\n- [Action]\n- [Action]\n\nÉléments transmis :\n[Logs / captures / message / URL]\n\nEscalade :\n[Équipe sécurité / SOC / autre]", "source": "nouveau"}, {"theme": "Matériel", "title": "PC - Préparation terminée", "content": "Bonjour [Prénom],\n\nVotre poste est préparé et prêt.\n\nÉléments préparés :\n- PC : [Modèle]\n- Chargeur\n- [Dock / casque / accessoires]\n- Configuration professionnelle\n\nMerci de me confirmer le mode de remise souhaité : retrait ou expédition.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Matériel", "title": "PC - Expédition effectuée", "content": "Bonjour [Prénom],\n\nVotre matériel a été expédié.\n\nContenu :\n- [Matériel]\n- [Accessoires]\n\nTransporteur : [Transporteur]\nSuivi : [N° de suivi]\n\nMerci de confirmer la bonne réception du colis.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Matériel", "title": "PC - Retrait disponible", "content": "Bonjour [Prénom],\n\nVotre matériel est disponible auprès du service informatique.\n\nMerci de convenir d'un créneau avant votre passage afin de garantir sa disponibilité.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Matériel", "title": "PC - Retour ancien matériel", "content": "Bonjour [Prénom],\n\nSuite à la mise à disposition de votre nouveau matériel, merci de prévoir le retour des équipements remplacés :\n\n- [Ancien PC]\n- [Chargeur]\n- [Dock / accessoires]\n\nMerci de me confirmer lorsque le matériel est prêt à être retourné.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Matériel", "title": "PC - Remplacement validé", "content": "Bonjour [Prénom],\n\nLe remplacement de votre poste a été validé.\n\nNous lançons la préparation du nouvel équipement et vous informerons dès qu'il sera prêt.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Matériel", "title": "PC - Diagnostic matériel nécessaire", "content": "Bonjour [Prénom],\n\nLes premiers tests orientent le diagnostic vers un problème matériel.\n\nMerci de laisser le poste disponible pour les tests complémentaires / la prise en charge.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Matériel", "title": "Écran - Mise à disposition", "content": "Bonjour [Prénom],\n\nUn écran [Modèle / taille] est disponible pour vous.\n\nMerci de confirmer si vous avez également besoin d'un câble [HDMI / DisplayPort / USB-C] ou d'un adaptateur.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Matériel", "title": "Dock - Mise à disposition", "content": "Bonjour [Prénom],\n\nUne station d'accueil compatible est disponible.\n\nAvant remise, merci de me confirmer le modèle exact du PC afin de vérifier la compatibilité alimentation / vidéo / USB-C.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Matériel", "title": "Casque - Mise à disposition", "content": "Bonjour [Prénom],\n\nUn casque est disponible pour vous.\n\nMerci de me confirmer si vous souhaitez un retrait ou un envoi avec votre prochain matériel.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Matériel", "title": "Chargeur - Mise à disposition", "content": "Bonjour [Prénom],\n\nUn chargeur compatible est disponible.\n\nMerci de confirmer le modèle du poste ainsi que le mode de remise souhaité.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Sécurité", "title": "Phishing - Accusé de réception", "content": "Bonjour [Prénom],\n\nMerci pour votre signalement.\n\nNe cliquez plus sur les liens du message et n'ouvrez aucune pièce jointe supplémentaire.\n\nLe message va être analysé. Si vous avez saisi un mot de passe ou validé une demande d'authentification, merci de le signaler immédiatement.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Sécurité", "title": "Phishing - Utilisateur a cliqué", "content": "Bonjour [Prénom],\n\nSuite au clic sur le lien suspect, merci de :\n1. ne plus interagir avec le message ;\n2. nous préciser si un identifiant ou mot de passe a été saisi ;\n3. indiquer si une validation MFA a été effectuée ;\n4. rester disponible pour les actions de sécurisation du compte.\n\nLe dossier est traité en priorité.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Sécurité", "title": "Compte - Suspicion de compromission", "content": "Bonjour [Prénom],\n\nUne vérification de sécurité est nécessaire sur votre compte.\n\nPar précaution, certaines sessions ou méthodes d'authentification peuvent être réinitialisées. Merci de rester disponible pour confirmer votre identité et effectuer une nouvelle connexion.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Sécurité", "title": "Blocage fichier / URL", "content": "Bonjour [Prénom],\n\nL'accès à [fichier / URL / application] est bloqué par un mécanisme de sécurité.\n\nMerci de transmettre :\n- le nom ou l'adresse complète ;\n- une capture du blocage ;\n- le besoin métier associé.\n\nUne analyse pourra ensuite être réalisée.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Sécurité", "title": "Alerte antivirus", "content": "Bonjour [Prénom],\n\nUne alerte de sécurité a été détectée sur le poste [Nom du poste].\n\nMerci de ne pas éteindre le poste sauf consigne contraire et de limiter son utilisation jusqu'à la fin des vérifications.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Sécurité", "title": "Demande d'exception sécurité", "content": "Bonjour [Prénom],\n\nPour étudier une exception de sécurité, merci de préciser :\n- l'application / URL concernée ;\n- la justification métier ;\n- la population concernée ;\n- la durée souhaitée ;\n- l'impact en cas de refus.\n\nLa demande pourra ensuite être soumise à validation.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Accès & MFA", "title": "Mot de passe - Réinitialisé", "content": "Bonjour [Prénom],\n\nVotre mot de passe a été réinitialisé.\n\nLors de la prochaine connexion, utilisez le mot de passe temporaire communiqué via le canal prévu, puis définissez un nouveau mot de passe conforme à la politique de sécurité.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Accès & MFA", "title": "MFA - Réinitialisation effectuée", "content": "Bonjour [Prénom],\n\nVos méthodes d'authentification multifacteur ont été réinitialisées.\n\nLors de votre prochaine connexion, l'enregistrement d'une nouvelle méthode vous sera demandé.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Accès & MFA", "title": "MFA - Nouvelle méthode", "content": "Bonjour [Prénom],\n\nPour ajouter une nouvelle méthode MFA :\n1. ouvrez la page de sécurité de votre compte ;\n2. ajoutez la méthode souhaitée ;\n3. suivez la validation demandée ;\n4. effectuez un test de connexion.\n\nContactez le support si l'enregistrement échoue.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Accès & MFA", "title": "Accès - Demande de justification", "content": "Bonjour [Prénom],\n\nPour traiter votre demande d'accès à [Ressource], merci de préciser :\n- le besoin métier ;\n- le niveau d'accès attendu ;\n- la durée si l'accès est temporaire ;\n- le responsable / valideur concerné.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Accès & MFA", "title": "Accès - Accord requis", "content": "Bonjour [Prénom],\n\nLa demande d'accès à [Ressource] nécessite une validation préalable de [Responsable / propriétaire].\n\nDès validation, le traitement pourra se poursuivre.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Accès & MFA", "title": "Accès - Ajout effectué", "content": "Bonjour [Prénom],\n\nL'accès à [Ressource] a été ajouté.\n\nUn délai de propagation peut être nécessaire. Merci de vous déconnecter / reconnecter avant de tester.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Applications", "title": "Application - Demande d'installation", "content": "Bonjour [Prénom],\n\nVotre demande d'installation de [Application] est bien prise en compte.\n\nMerci de préciser si nécessaire :\n- la version souhaitée ;\n- le besoin métier ;\n- le nombre d'utilisateurs ;\n- l'urgence éventuelle.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Applications", "title": "Application - Installation terminée", "content": "Bonjour [Prénom],\n\nL'installation de [Application] est terminée sur [Poste].\n\nMerci de lancer l'application et de confirmer son bon fonctionnement.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Applications", "title": "Application - Installation non autorisée", "content": "Bonjour [Prénom],\n\nL'application [Application] n'est pas actuellement disponible dans le catalogue autorisé.\n\nUne validation / étude complémentaire est nécessaire avant installation.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Applications", "title": "Application - Mise à jour requise", "content": "Bonjour [Prénom],\n\nUne mise à jour de [Application] est nécessaire afin de corriger le problème rencontré / maintenir la compatibilité.\n\nMerci d'enregistrer votre travail avant l'intervention.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Applications", "title": "Application - Réinstallation proposée", "content": "Bonjour [Prénom],\n\nLes premiers tests n'ayant pas corrigé le problème, je propose une réinstallation de [Application].\n\nMerci de confirmer que vos données locales liées à l'application sont sauvegardées avant intervention.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Applications", "title": "Application - Licence manquante", "content": "Bonjour [Prénom],\n\nLe problème semble lié à l'absence ou à l'expiration d'une licence pour [Application].\n\nLa demande va être transmise à l'équipe / au gestionnaire concerné pour vérification.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Microsoft 365", "title": "Outlook - Test Web demandé", "content": "Bonjour [Prénom],\n\nPour isoler le problème Outlook, merci de tester votre messagerie depuis la version Web.\n\nMerci de préciser si le problème est :\n- présent uniquement dans Outlook installé ;\n- également présent sur le Web.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Microsoft 365", "title": "Outlook - Nouveau profil proposé", "content": "Bonjour [Prénom],\n\nLe diagnostic Outlook nécessite la création d'un nouveau profil local.\n\nCette opération ne supprime pas votre boîte aux lettres hébergée dans Microsoft 365, mais peut nécessiter la reconfiguration de certains éléments locaux.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Microsoft 365", "title": "OneDrive - Synchronisation", "content": "Bonjour [Prénom],\n\nLe problème concerne la synchronisation OneDrive.\n\nMerci de laisser OneDrive ouvert et de ne pas déplacer / supprimer de fichiers pendant le diagnostic.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Microsoft 365", "title": "Teams - Cache / redémarrage", "content": "Bonjour [Prénom],\n\nUne action de nettoyage / redémarrage Teams va être réalisée.\n\nMerci d'enregistrer vos messages ou éléments en cours avant l'intervention.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Microsoft 365", "title": "Office - Réparation", "content": "Bonjour [Prénom],\n\nUne réparation de Microsoft 365 Apps est nécessaire.\n\nMerci de fermer Word, Excel, PowerPoint, Outlook et les autres applications Office avant l'intervention.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Microsoft 365", "title": "Boîte partagée - Accès ajouté", "content": "Bonjour [Prénom],\n\nL'accès à la boîte partagée [Nom de la boîte] a été ajouté / corrigé.\n\nMerci de relancer Outlook et de prévoir un délai de propagation avant de tester.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Réseau & VPN", "title": "VPN - Premier diagnostic", "content": "Bonjour [Prénom],\n\nConcernant le problème VPN, merci de préciser :\n- le réseau utilisé (domicile / partage mobile / autre) ;\n- le message d'erreur exact ;\n- si Internet fonctionne hors VPN ;\n- l'heure du dernier échec.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Réseau & VPN", "title": "VPN - Test autre réseau", "content": "Bonjour [Prénom],\n\nPour isoler l'origine du problème VPN, pouvez-vous effectuer un test depuis un autre accès Internet, par exemple un partage de connexion mobile ?\n\nMerci de m'indiquer le résultat.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Réseau & VPN", "title": "Wi-Fi - Informations nécessaires", "content": "Bonjour [Prénom],\n\nPour le problème Wi-Fi, merci de transmettre :\n- le nom du réseau concerné ;\n- si d'autres appareils se connectent ;\n- le message affiché ;\n- si le problème est permanent ou intermittent.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Réseau & VPN", "title": "Réseau - Incident local ou général", "content": "Bonjour [Prénom],\n\nPour déterminer si l'incident réseau est local ou plus large, pouvez-vous me confirmer si d'autres utilisateurs proches rencontrent le même problème ?\n\nMerci également de préciser si la connexion Ethernet / Wi-Fi est concernée.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Réseau & VPN", "title": "Proxy / accès Web", "content": "Bonjour [Prénom],\n\nPour le problème d'accès Web, merci de transmettre l'adresse exacte du site concerné ainsi qu'une capture du message affiché.\n\nMerci également de préciser si d'autres sites fonctionnent normalement.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Arrivée & Départ", "title": "Arrivée - Préparation compte et poste", "content": "PRÉPARATION ARRIVÉE\n\nCollaborateur : [Nom]\nDate d'arrivée : [Date]\nResponsable : [Responsable]\n\nÀ préparer :\n- compte utilisateur ;\n- poste de travail ;\n- licences ;\n- groupes / accès ;\n- messagerie ;\n- MFA ;\n- applications ;\n- accessoires ;\n- mobile si nécessaire.\n\nCommentaires :\n[Informations]", "source": "nouveau"}, {"theme": "Arrivée & Départ", "title": "Arrivée - Matériel prêt", "content": "Bonjour [Prénom],\n\nVotre environnement de travail est préparé pour votre arrivée.\n\nLe poste, les accès principaux et les éléments nécessaires à la première connexion sont prêts.\n\nUn accompagnement pourra être réalisé lors de la première ouverture de session.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Arrivée & Départ", "title": "Départ - Checklist IT", "content": "CHECKLIST DÉPART\n\nUtilisateur : [Nom]\nDate de départ : [Date]\n\nÀ traiter :\n- désactivation du compte ;\n- révocation des sessions ;\n- MFA ;\n- délégation / transfert messagerie ;\n- OneDrive / données ;\n- groupes / accès ;\n- licences ;\n- récupération PC ;\n- chargeur / dock / écran / casque ;\n- téléphone professionnel ;\n- autres équipements.\n\nStatut :\n[À compléter]", "source": "nouveau"}, {"theme": "Arrivée & Départ", "title": "Départ - Retour matériel", "content": "Bonjour [Prénom],\n\nDans le cadre de votre départ, merci de restituer les équipements professionnels en votre possession :\n\n- [PC]\n- [Chargeur]\n- [Dock]\n- [Écran]\n- [Casque]\n- [Téléphone]\n- [Autres]\n\nMerci de confirmer le mode de retour prévu.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Relances & Escalades", "title": "Relance - Utilisateur indisponible", "content": "Bonjour [Prénom],\n\nJe n'ai pas pu vous joindre concernant [Sujet].\n\nMerci de me communiquer un créneau de disponibilité afin que nous puissions poursuivre le diagnostic.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Relances & Escalades", "title": "Relance - Test attendu", "content": "Bonjour [Prénom],\n\nJe reviens vers vous concernant le test demandé sur [Sujet].\n\nPouvez-vous me confirmer le résultat afin que nous puissions clôturer ou poursuivre l'analyse ?\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Relances & Escalades", "title": "Escalade - Fournisseur", "content": "Bonjour,\n\nNous sollicitons votre support concernant l'incident suivant :\n\nClient / utilisateur : [Référence]\nProduit / service : [Produit]\nDébut incident : [Date / heure]\nImpact : [Impact]\nErreur : [Erreur]\n\nTests déjà réalisés :\n- [Test]\n- [Test]\n\nMerci de nous indiquer les prochaines actions recommandées.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Relances & Escalades", "title": "Escalade - Équipe infrastructure", "content": "Bonjour,\n\nMerci de prendre en charge l'analyse suivante :\n\nTicket : [N°]\nUtilisateur / poste : [Informations]\nService concerné : [Service]\nImpact : [Impact]\n\nDiagnostic déjà réalisé :\n[Diagnostic]\n\nLogs / éléments :\n[Éléments]\n\nAction attendue :\n[Demande]", "source": "nouveau"}, {"theme": "Relances & Escalades", "title": "Escalade - Équipe sécurité", "content": "Bonjour,\n\nMerci d'analyser l'événement de sécurité suivant :\n\nTicket : [N°]\nUtilisateur / poste : [Informations]\nType : [Type]\nDate / heure : [Date]\nIndicateurs : [URL / expéditeur / fichier / alerte]\n\nActions déjà réalisées :\n[Actions]\n\nMerci de confirmer la conduite à tenir.", "source": "nouveau"}, {"theme": "Relances & Escalades", "title": "Escalade - N3 avec chronologie", "content": "ESCALADE N3\n\nTicket : [N°]\nImpact : [Impact]\n\nChronologie :\n[Heure] - [Événement]\n[Heure] - [Test]\n[Heure] - [Action]\n[Heure] - [Résultat]\n\nÉtat actuel :\n[État]\n\nBesoin :\n[Action / expertise demandée]", "source": "nouveau"}, {"theme": "Incident majeur", "title": "Incident majeur - Accusé utilisateur", "content": "Bonjour,\n\nUn incident général affecte actuellement [Service / application].\n\nLes équipes techniques sont mobilisées. Il n'est pas nécessaire de créer plusieurs tickets pour le même symptôme.\n\nNous communiquerons une mise à jour dès qu'un nouvel élément sera disponible.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Incident majeur", "title": "Incident majeur - Mise à jour", "content": "MISE À JOUR INCIDENT\n\nService : [Service]\nHeure : [Heure]\nStatut : [En cours / amélioration / surveillance]\n\nÉtat actuel :\n[Description]\n\nActions en cours :\n[Actions]\n\nProchaine mise à jour :\n[Dès nouvel élément / heure prévue]", "source": "nouveau"}, {"theme": "Incident majeur", "title": "Incident majeur - Service rétabli", "content": "Bonjour,\n\nLe service [Service] est de nouveau disponible.\n\nLes équipes continuent la surveillance. Si vous rencontrez encore le problème, merci de relancer l'application / la session puis de signaler le cas avec les détails nécessaires.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Incident majeur", "title": "Incident majeur - Contournement", "content": "Bonjour,\n\nL'incident sur [Service] est toujours en cours.\n\nContournement temporaire disponible :\n[Procédure]\n\nMerci d'utiliser cette solution uniquement jusqu'au rétablissement complet du service.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Maintenance & Changement", "title": "Maintenance - Information préalable", "content": "Bonjour,\n\nUne opération de maintenance est prévue sur [Service / application / équipement].\n\nPériode : [Date / plage]\nImpact possible : [Impact]\nAction utilisateur : [Action éventuelle]\n\nUne confirmation sera envoyée à la fin de l'intervention.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Maintenance & Changement", "title": "Maintenance - Terminée", "content": "Bonjour,\n\nL'opération de maintenance sur [Service] est terminée.\n\nLes contrôles de validation sont concluants et le service est disponible.\n\nMerci de signaler toute anomalie résiduelle.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Maintenance & Changement", "title": "Changement - Redémarrage requis", "content": "Bonjour [Prénom],\n\nUne modification a été appliquée sur votre poste / compte et nécessite un redémarrage pour être pleinement prise en compte.\n\nMerci d'enregistrer votre travail puis de redémarrer le poste.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Maintenance & Changement", "title": "Changement - Fenêtre d'intervention", "content": "Bonjour [Prénom],\n\nUne intervention est nécessaire sur [Poste / service].\n\nDurée estimée : [Durée]\nImpact : [Impact]\nPréparation demandée : [Fermer applications / enregistrer travail / autre]\n\nMerci de confirmer le créneau retenu.\n\nCordialement,\nSupport informatique", "source": "nouveau"}, {"theme": "Messages rapides", "title": "Teams - Je regarde", "content": "Bonjour [Prénom], je prends le sujet et je reviens vers toi dès que j'ai un premier résultat.", "source": "nouveau"}, {"theme": "Messages rapides", "title": "Teams - Besoin du poste", "content": "Bonjour [Prénom], peux-tu rester disponible devant le poste quelques minutes pour que je poursuive le diagnostic ?", "source": "nouveau"}, {"theme": "Messages rapides", "title": "Teams - Test demandé", "content": "Peux-tu refaire le test maintenant et me dire exactement ce qui s'affiche ?", "source": "nouveau"}, {"theme": "Messages rapides", "title": "Teams - Redémarrage demandé", "content": "Peux-tu enregistrer ton travail puis redémarrer complètement le poste et refaire le test ?", "source": "nouveau"}, {"theme": "Messages rapides", "title": "Teams - Résolu ?", "content": "La correction est appliquée. Peux-tu confirmer que tout fonctionne correctement maintenant ?", "source": "nouveau"}, {"theme": "Messages rapides", "title": "Teams - Merci clôture", "content": "Merci pour ton retour. Je clôture le ticket comme résolu. N'hésite pas à ouvrir une nouvelle demande si le problème revient.", "source": "nouveau"}], "scripts": [{"theme": "Réseau", "title": "IPCONFIG complet", "content": "ipconfig /all"}, {"theme": "Réseau", "title": "Résumé IP PowerShell", "content": "Get-NetIPConfiguration | Format-List InterfaceAlias,InterfaceDescription,IPv4Address,IPv6Address,IPv4DefaultGateway,DNSServer"}, {"theme": "Réseau", "title": "Cartes réseau", "content": "Get-NetAdapter | Sort-Object Status,Name | Format-Table Name,InterfaceDescription,Status,LinkSpeed,MacAddress -Auto"}, {"theme": "Réseau", "title": "DNS configurés", "content": "Get-DnsClientServerAddress | Where-Object {$_.ServerAddresses} | Format-Table InterfaceAlias,AddressFamily,ServerAddresses -Auto"}, {"theme": "Réseau", "title": "Cache DNS", "content": "Get-DnsClientCache | Select-Object Entry,Name,Data,Status | Format-Table -Auto"}, {"theme": "Réseau", "title": "Vider cache DNS", "content": "ipconfig /flushdns"}, {"theme": "Réseau", "title": "Résolution DNS Microsoft", "content": "Resolve-DnsName login.microsoftonline.com -ErrorAction Continue"}, {"theme": "Réseau", "title": "NSLOOKUP", "content": "nslookup login.microsoftonline.com"}, {"theme": "Réseau", "title": "Tester passerelle", "content": "$gw=(Get-NetRoute -DestinationPrefix \"0.0.0.0/0\" -ErrorAction SilentlyContinue | Sort-Object RouteMetric | Select-Object -First 1).NextHop; if($gw){Test-Connection $gw -Count 3}else{\"Aucune passerelle IPv4\"}"}, {"theme": "Réseau", "title": "Test Internet 443", "content": "Test-NetConnection login.microsoftonline.com -Port 443 -InformationLevel Detailed"}, {"theme": "Réseau", "title": "Test Graph 443", "content": "Test-NetConnection graph.microsoft.com -Port 443 -InformationLevel Detailed"}, {"theme": "Réseau", "title": "Connexions TCP", "content": "Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue | Sort-Object RemoteAddress | Select-Object LocalAddress,LocalPort,RemoteAddress,RemotePort,OwningProcess | Format-Table -Auto"}, {"theme": "Réseau", "title": "NETSTAT", "content": "netstat -ano"}, {"theme": "Réseau", "title": "Routes", "content": "route print"}, {"theme": "Réseau", "title": "ARP", "content": "arp -a"}, {"theme": "Réseau", "title": "Proxy WinHTTP", "content": "netsh winhttp show proxy"}, {"theme": "Réseau", "title": "Proxy utilisateur", "content": "Get-ItemProperty \"HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\" | Select ProxyEnable,ProxyServer,AutoConfigURL"}, {"theme": "Réseau", "title": "DHCP Release / Renew", "content": "ipconfig /release; ipconfig /renew"}, {"theme": "Réseau", "title": "Winsock reset", "content": "netsh winsock reset"}, {"theme": "Réseau", "title": "Reset TCP/IP", "content": "netsh int ip reset"}, {"theme": "Système", "title": "SystemInfo", "content": "systeminfo"}, {"theme": "Système", "title": "Windows / Build", "content": "Get-CimInstance Win32_OperatingSystem | Select Caption,Version,BuildNumber,OSArchitecture,InstallDate,LastBootUpTime | Format-List"}, {"theme": "Système", "title": "Uptime", "content": "$os=Get-CimInstance Win32_OperatingSystem; New-TimeSpan -Start $os.LastBootUpTime -End (Get-Date)"}, {"theme": "Système", "title": "BIOS", "content": "Get-CimInstance Win32_ComputerSystem | Select Manufacturer,Model; Get-CimInstance Win32_BIOS | Select Manufacturer,SMBIOSBIOSVersion,SerialNumber,ReleaseDate"}, {"theme": "Système", "title": "SFC VerifyOnly", "content": "sfc /verifyonly"}, {"theme": "Système", "title": "SFC ScanNow", "content": "sfc /scannow"}, {"theme": "Système", "title": "DISM CheckHealth", "content": "DISM /Online /Cleanup-Image /CheckHealth"}, {"theme": "Système", "title": "DISM ScanHealth", "content": "DISM /Online /Cleanup-Image /ScanHealth"}, {"theme": "Système", "title": "DISM RestoreHealth", "content": "DISM /Online /Cleanup-Image /RestoreHealth"}, {"theme": "Système", "title": "CHKDSK Online", "content": "chkdsk C: /scan"}, {"theme": "Système", "title": "Erreurs système 24h", "content": "Get-WinEvent -FilterHashtable @{LogName=\"System\";Level=1,2;StartTime=(Get-Date).AddHours(-24)} -ErrorAction SilentlyContinue | Select TimeCreated,Id,ProviderName,Message | Format-List"}, {"theme": "Système", "title": "Erreurs applications 24h", "content": "Get-WinEvent -FilterHashtable @{LogName=\"Application\";Level=1,2;StartTime=(Get-Date).AddHours(-24)} -ErrorAction SilentlyContinue | Select TimeCreated,Id,ProviderName,Message | Format-List"}, {"theme": "Système", "title": "Fiabilité récente", "content": "Get-CimInstance Win32_ReliabilityRecords -ErrorAction SilentlyContinue | Sort-Object TimeGenerated -Descending | Select -First 30 TimeGenerated,SourceName,EventIdentifier,Message | Format-List"}, {"theme": "Système", "title": "Redémarrage en attente", "content": "$p=@(); if(Test-Path \"HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Component Based Servicing\\RebootPending\"){$p+=\"CBS\"}; if(Test-Path \"HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\WindowsUpdate\\Auto Update\\RebootRequired\"){$p+=\"Windows Update\"}; $x=(Get-ItemProperty \"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\" -Name PendingFileRenameOperations -ErrorAction SilentlyContinue); if($x){$p+=\"PendingFileRenameOperations\"}; if($p){$p}else{\"Aucun indicateur détecté\"}"}, {"theme": "Processus & Services", "title": "Top RAM", "content": "Get-Process | Sort-Object WorkingSet64 -Descending | Select -First 15 Name,Id,@{N=\"RAM_MB\";E={[math]::Round($_.WorkingSet64/1MB,1)}} | Format-Table -Auto"}, {"theme": "Processus & Services", "title": "Top CPU", "content": "Get-Process | Sort-Object CPU -Descending | Select -First 15 Name,Id,CPU,@{N=\"RAM_MB\";E={[math]::Round($_.WorkingSet64/1MB,1)}} | Format-Table -Auto"}, {"theme": "Processus & Services", "title": "Tous les processus", "content": "Get-Process | Sort-Object Name | Select Name,Id,CPU,@{N=\"RAM_MB\";E={[math]::Round($_.WorkingSet64/1MB,1)}} | Format-Table -Auto"}, {"theme": "Processus & Services", "title": "Services auto arrêtés", "content": "Get-CimInstance Win32_Service | Where-Object {$_.StartMode -eq \"Auto\" -and $_.State -ne \"Running\"} | Select Name,DisplayName,State,StartMode | Format-Table -Auto"}, {"theme": "Processus & Services", "title": "Services en erreur", "content": "Get-CimInstance Win32_Service | Where-Object {$_.ExitCode -ne 0 -or $_.State -eq \"Stopped\"} | Select Name,DisplayName,State,StartMode,ExitCode | Format-Table -Auto"}, {"theme": "Processus & Services", "title": "Redémarrer Spooler", "content": "Restart-Service Spooler -Force"}, {"theme": "Disque & Stockage", "title": "Volumes", "content": "Get-Volume | Select DriveLet async function copyText(txt,btn,type,x){
 try{
   await navigator.clipboard.writeText(txt);
   if(type&&x)setRecent(type,x);
   let old=btn.textContent;btn.textContent="✓ Copié";setTimeout(()=>btn.textContent=old,1200)
 }catch(e){openEditor(x?x.title:"À copier",txt,type,x)}
}
function openEditor(title,txt,type,x){
 document.getElementById("editTitle").textContent=title;
 document.getElementById("editor").value=txt;
 document.getElementById("editModal").classList.add("open");
 document.getElementById("copyEdited").onclick=e=>copyText(document.getElementById("editor").value,e.target,type,x);
 document.getElementById("saveCustom").onclick=()=>{
   const body=document.getElementById("editor").value;
   custom.push({theme:(x&&x.theme)||"Mails",title:title+" - personnalisé",content:body,source:"personnalisé"});
   save();document.getElementById("editModal").classList.remove("open");render();
 };
}

}

function weatherStateMeta(st){
 if(st==="ok")return ["ok","Opérationnel"];
 if(st==="warn")return ["warn","Perturbation"];
 if(st==="down")return ["down","Incident majeur"];
 if(st==="info")return ["info","Info"];
 if(st==="loading")return ["","Vérification…"];
 return ["","Indisponible"];
}
function indicatorState(v){
 if(v==="none")return "ok";
 if(v==="minor")return "warn";
 if(v==="major"||v==="critical")return "down";
 return "unknown";
}
function weatherCounts(){
 const vals=Object.values(weatherLive),ok=vals.filter(x=>x==="ok").length,warn=vals.filter(x=>x==="warn").length,down=vals.filter(x=>x==="down").length;
 return {ok,warn,down};
}
function forecast(){
 const c=weatherCounts();
 if(c.down)return ["🌩️","Incident majeur détecté"];
 if(c.warn)return ["🌦️","Perturbation à surveiller"];
 if(!weatherLoaded)return ["🌤️","Vérification des services publics…"];
 return ["☀️","Services surveillés opérationnels"];
}

 '<div class="weathergrid" style="margin-top:10px">'+RELEASES.map(releaseCard).join("")+'</div>'+
